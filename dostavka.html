<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Доставка, оплата, обмін — Just shop</title>
<meta name="description" content="Доставка Новою Поштою по Україні: відділення, поштомат, курʼєр. Самовивіз у Києві. Оплата на картку ФОП або наложеним платежем. Обмін 14 днів, розмірна сітка, відстеження посилки.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,500..900&family=Inter+Tight:wght@400..600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20260921g">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/favicon.png">
</head>
<body data-page="dostavka">

<div class="tick" id="tick"></div>
<header id="hdr"></header>

<main class="page">
  <div class="wrap">
    <div class="page__h">
      <p class="mono" style="color:var(--mut)">Як це працює</p>
      <h1 class="dsp h-lg" style="margin-top:10px">Доставка<br>й оплата</h1>
      <p class="lead" style="margin-top:16px;max-width:54ch" data-txt="dlv_lead">Відправляємо в день оплати, якщо річ у наявності.</p>
    </div>

    <!-- НОВА ПОШТА -->
    <h2 class="dsp h-md" style="margin-bottom:18px">Нова Пошта по Україні</h2>
    <div class="cols2" id="dlvBlocks"></div>

    <!-- ОПЛАТА -->
    <h2 class="dsp h-md" style="margin:clamp(40px,6vw,74px) 0 18px">Оплата</h2>
    <div class="cols2" id="payBlocks"></div>

    <!-- ВІДСТЕЖЕННЯ -->
    <section id="trek" style="margin-top:clamp(40px,6vw,74px)">
      <h2 class="dsp h-md" style="margin-bottom:8px">Відстежити посилку</h2>
      <p class="lead" style="max-width:48ch" data-txt="trk_lead">Введіть номер накладної — покажемо статус прямо тут.</p>
      <div class="trk">
        <input id="trkNo" inputmode="numeric" placeholder="59000 000 000 000" aria-label="Номер накладної">
        <button class="btn" type="button" id="trkGo">Перевірити</button>
      </div>
      <p class="trkres" id="trkOut"></p>
    </section>

    <!-- РОЗМІРИ -->
    <section id="rozmiry" style="margin-top:clamp(40px,6vw,74px)">
      <h2 class="dsp h-md" style="margin-bottom:8px">Розмірна сітка</h2>
      <p class="lead" style="max-width:54ch" data-txt="size_lead">Виміри самої речі в сантиметрах.</p>
      <div id="szGuide"></div>
    </section>

    <!-- ПОВЕРНЕННЯ -->
    <section id="povernennia" style="margin-top:clamp(40px,6vw,74px)">
      <h2 class="dsp h-md" style="margin-bottom:18px">Обмін і повернення</h2>
      <div class="cols2" id="retBlocks"></div>
    </section>
  </div>
</main>

<footer id="ft"></footer>

<script src="sprite.js?v=20260921g"></script>
<script src="data.js?v=20260921g"></script>
<script src="platform.js?v=20260921g"></script>
<script src="app.js?v=20260921g"></script>
</body>
</html>
